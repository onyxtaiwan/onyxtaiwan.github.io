<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Not Completed | ONYX Taiwan</title>
    <meta name="robots" content="noindex">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#0f0f0f] text-gray-200 antialiased selection:bg-[#d4af37] selection:text-[#0f0f0f] min-h-screen flex flex-col">

    <nav class="w-full py-6 text-center absolute top-0">
        <a href="../index.html" class="inline-block">
            <span class="text-xl md:text-2xl font-bold text-white tracking-widest uppercase">
                ONYX <span class="text-[#d4af37]">TAIWAN</span>
            </span>
        </a>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4 mt-12 md:mt-16">
        <div class="max-w-md w-full bg-gradient-to-br from-[#1a1a1a] to-[#0f0f0f] p-6 md:p-8 rounded-2xl border border-[#d4af37]/30 shadow-2xl shadow-[#d4af37]/10 text-center relative overflow-hidden">
            <div class="w-16 h-16 mx-auto mb-5 rounded-full bg-red-500/10 border border-red-500/40 flex items-center justify-center"><i data-lucide="alert-circle" class="w-8 h-8 text-red-400"></i></div>
            <h1 class="text-2xl font-bold text-white mb-2">Payment Not Completed</h1>
            <p class="text-sm text-gray-300 leading-relaxed mb-6">The payment was not completed. Your booking request is saved.<br>You can try again with the payment link in your confirmation email, or contact us on WhatsApp.</p>
            <a id="retry" href="../pay.html" class="w-full block bg-[#d4af37] text-[#0f0f0f] py-3.5 rounded-lg font-bold mb-3">Try again</a>
            <a id="wa" href="https://wa.me/886970326591" target="_blank" rel="noopener" class="w-full flex items-center justify-center gap-2 bg-[#25D366] hover:bg-[#1ebd5b] text-white py-3.5 rounded-lg font-bold"><i data-lucide="message-circle" class="w-5 h-5"></i> Get help on WhatsApp</a>
        </div>
    </main>
    <script>
        const id = new URLSearchParams(location.search).get('order') || '';
        document.getElementById('retry').href = '../pay.html?order=' + encodeURIComponent(id);
        document.getElementById('wa').href = 'https://wa.me/886970326591?text=' + encodeURIComponent('Hi ONYX! My payment for ' + id + ' did not go through. Can you help?');
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
