<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Deposit | ONYX Taiwan</title>
    <meta name="robots" content="noindex">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#0f0f0f] text-gray-200 antialiased selection:bg-[#d4af37] selection:text-[#0f0f0f] min-h-screen flex flex-col">

    <nav class="w-full py-6 text-center absolute top-0">
        <a href="index.html" class="inline-block">
            <span class="text-xl md:text-2xl font-bold text-white tracking-widest uppercase">
                ONYX <span class="text-[#d4af37]">TAIWAN</span>
            </span>
        </a>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4 mt-12 md:mt-16">
        <div class="max-w-md w-full bg-gradient-to-br from-[#1a1a1a] to-[#0f0f0f] p-6 md:p-8 rounded-2xl border border-[#d4af37]/30 shadow-2xl text-center">
            <h1 class="text-2xl font-bold text-white mb-2">Pay Your Deposit</h1>
            <p class="text-sm text-gray-400 mb-5">Order <strong class="text-[#d4af37]" id="oid">—</strong></p>
            <div id="box" class="text-sm text-gray-300">Loading…</div>
            <div id="paypal" class="mt-5"></div>
            <a href="https://wa.me/886970326591" target="_blank" rel="noopener" class="block mt-5 text-[#25D366] text-sm underline">Questions? WhatsApp us</a>
        </div>
    </main>
    <script src="js/onyx-config.js?v=2026-11-12"></script>
   <script>
        // set in js/onyx-config.js
        const PAYMENT_GAS_URL = (window.ONYX_SETTINGS || {}).PAYMENT_GAS_URL || "";
        const PAYPAL_CLIENT_ID = (window.ONYX_SETTINGS || {}).PAYPAL_CLIENT_ID || "";
        const id = new URLSearchParams(location.search).get('order') || '';
        const box = document.getElementById('box');
        document.getElementById('oid').textContent = id || '—';
        const post = b => fetch(PAYMENT_GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(b) }).then(r => r.json());
        const fmt = n => 'TWD ' + Number(n).toLocaleString('en-US');
        if (!id || !PAYMENT_GAS_URL || !PAYPAL_CLIENT_ID) { box.textContent = 'This payment link is not active yet. Please contact us on WhatsApp.'; }
        else post({ action: 'status', orderId: id }).then(r => {
            if (!r.ok) { box.textContent = 'We could not find this booking. Please contact us on WhatsApp.'; return; }
            if (r.status === 'Paid') { box.innerHTML = '<p class="text-green-400 font-bold">This deposit is already paid. Thank you!</p>'; return; }
            box.innerHTML = '<div class="flex justify-between"><span>Total</span><span>' + fmt(r.total) + '</span></div><div class="flex justify-between text-white font-bold text-lg mt-1"><span>Deposit</span><span>' + fmt(r.deposit) + '</span></div><div class="flex justify-between mt-1"><span>Balance (cash to chauffeur)</span><span>' + fmt(r.total - r.deposit) + '</span></div>';
            const s = document.createElement('script');
            s.src = 'https://www.paypal.com/sdk/js?client-id=' + encodeURIComponent(PAYPAL_CLIENT_ID) + '&currency=TWD&intent=capture&components=buttons';
            s.onload = () => paypal.Buttons({
                style: { color: 'gold', shape: 'rect', label: 'pay' },
                createOrder: () => post({ action: 'create', orderId: id }).then(x => { if (!x.ok) throw new Error(x.error); return x.paypalOrderId; }),
                onApprove: d => post({ action: 'capture', orderId: id, paypalOrderId: d.orderID }).then(x => { location.href = (x.ok ? 'checkout/deposit-success.html' : 'checkout/deposit-fail.html') + '?order=' + encodeURIComponent(id); }),
                onError: () => { location.href = 'checkout/deposit-fail.html?order=' + encodeURIComponent(id); }
            }).render('#paypal');
            document.head.appendChild(s);
        }).catch(() => { box.textContent = 'We could not load this payment. Please try again or contact us on WhatsApp.'; });
    </script>

    <script>lucide.createIcons();</script>
</body>
</html>
