<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>ONYX 計價區域地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body{height:100%;margin:0;font:14px/1.5 system-ui,-apple-system,'Noto Sans TC',sans-serif}#map{position:absolute;inset:0}
.box{position:absolute;z-index:1000;left:12px;top:12px;max-width:330px;background:#fff;color:#1b1b1b;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.25);padding:12px 14px}
.box h1{font-size:16px;margin:0 0 6px}.box p{margin:4px 0}.k{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.box button{margin:6px 6px 0 0;padding:5px 10px;border:1px solid #ccc;border-radius:6px;background:#f6f6f6;cursor:pointer;font:inherit}
.small{color:#666;font-size:12px}@media (max-width:600px){.box{left:8px;right:8px;top:auto;bottom:16px;max-width:none}}</style></head><body>
<div id="map"></div>
<div class="box"><h1>ONYX 計價區域地圖</h1>
<p><span class="k" style="background:#d04040"></span>高山 <span class="k" style="background:#a040d0"></span>清境 <span class="k" style="background:#ff8000"></span>中山 <span class="k" style="background:#2080d0"></span>偏遠（接送） <span class="k" style="background:#333"></span>人工報價</p>
<p class="small">點任何一個圈看加價和半徑。點地圖上任一地點（例如飯店），會顯示它在哪些圈內、離清境中心幾 km。右上角可開關圖層。</p>
<button id="qj">看清境</button><button id="all">看全台</button></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

121.474,"km":3,"t":"mid","info":"中山：包車 1,000；起點在圈內不能選 4 小時"}],"remote":[{"n":"Jiufen / Jinguashi / Houtong","lat":25.103,"lng":121.852,"km":4,"t":"remote","info":"接送 +200"},{"n":"Pingxi / Shifen / Jingtong","lat":25.033,"lng":121.75,"km":5,"t":"remote","info":"接送 +200"},{"n":"Jinshan / Wanli / Yehliu","lat":25.205,"lng":121.665,"km":6,"t":"remote","info":"接送 +200"},{"n":"Shimen / Sanzhi / Baishawan","lat":25.275,"lng":121.535,"km":6,"t":"remote","info":"接送 +200"},{"n":"Wulai","lat":24.8653,"lng":121.5506,"km":5,"t":"remote","info":"接送 +200"},{"n":"Pinglin","lat":24.9364,"lng":121.7114,"km":4,"t":"remote","info":"接送 +200"},{"n":"Sanxia mountains (Dabanggen, Manyueyuan)","lat":24.855,"lng":121.4,"km":4,"t":"remote","info":"接送 +200"},{"n":"Neiwan","lat":24.7051,"lng":121.1825,"km":4,"t":"remote","info":"接送 +200"},{"n":"Beipu / Emei","lat":24.693,"lng":121.037,"km":4,"t":"remote","info":"接送 +200"},{"n":"Nanzhuang","lat":24.5967,"lng":121.0006,"km":5,"t":"remote","info":"接送 +200"},{"n":"Bitou Cape / Longdong","lat":25.117,"lng":121.921,"km":3.5,"t":"remote","info":"接送 +200"},{"n":"Fulong / Gongliao / Shuangxi","lat":25.022,"lng":121.905,"km":6,"t":"remote","info":"接送 +300"},{"n":"Fuxing (Jiaobanshan, Xiaowulai)","lat":24.812,"lng":121.37,"km":5,"t":"remote","info":"接送 +300"},{"n":"Tai'an Hot Springs","lat":24.465,"lng":120.99,"km":6,"t":"remote","info":"接送 +300"},{"n":"Dahu","lat":24.423,"lng":120.864,"km":4,"t":"remote","info":"接送 +300"},{"n":"Xinshe","lat":24.2342,"lng":120.8106,"km":5,"t":"remote","info":"接送 +300"},{"n":"Jiji / Checheng","lat":23.83,"lng":120.825,"km":6,"t":"remote","info":"接送 +300"},{"n":"Gukeng / Huashan coffee","lat":23.635,"lng":120.585,"km":5,"t":"remote","info":"接送 +300"},{"n":"Caoling","lat":23.597,"lng":120.677,"km":5,"t":"remote","info":"接送 +300"},{"n":"Guanziling","lat":23.3378,"lng":120.505,"km":4,"t":"remote","info":"接送 +300"},{"n":"Qigu Salt Mountain","lat":23.1539,"lng":120.0995,"km":5,"t":"remote","info":"接送 +300"},{"n":"Beimen (salt fields, Crystal Church)","lat":23.2643,"lng":120.1227,"km":4,"t":"remote","info":"接送 +300"},{"n":"Dongshi / Budai","lat":23.418,"lng":120.16,"km":6,"t":"remote","info":"接送 +300"},{"n":"Meinong","lat":22.898,"lng":120.5418,"km":5,"t":"remote","info":"接送 +300"},{"n":"Donggang (Xiaoliuqiu ferry)","lat":22.4664,"lng":120.4495,"km":4,"t":"remote","info":"接送 +300"},{"n":"Nan'ao / Dong'ao / Fenniaolin","lat":24.49,"lng":121.82,"km":7,"t":"remote","info":"接送 +500"},{"n":"Liugui / Maolin","lat":22.94,"lng":120.65,"km":8,"t":"remote","info":"接送 +500"},{"n":"Baolai","lat":23.108,"lng":120.703,"km":5,"t":"remote","info":"接送 +500"},{"n":"Xuhai","lat":22.195,"lng":120.885,"km":6,"t":"remote","info":"接送 +500"},{"n":"Sandimen / Wutai","lat":22.73,"lng":120.69,"km":7,"t":"remote","info":"接送 +500"}],"manual":[{"n":"Smangus / Zhenxibao","lat":24.59,"lng":121.34,"km":5,"t":"manual","info":"路線經過就人工報價"}]};
var C={high:'#d04040',qj:'#a040d0',mid:'#ff8000',remote:'#2080d0',manual:'#333333'};
var map=L.map('map',{zoomControl:true});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
var groups={'高山圈':L.layerGroup(),'清境':L.layerGroup(),'中山圈':L.layerGroup(),'偏遠景點（接送）':L.layerGroup(),'人工報價':L.layerGroup()};
var name={high:'高山圈',qj:'清境',mid:'中山圈',remote:'偏遠景點（接送）',manual:'人工報價'};
var all=D.mountain.concat(D.remote,D.manual);
all.forEach(function(z){var c=L.circle([z.lat,z.lng],{radius:z.km*1000,color:C[z.t],weight:2,fillOpacity:z.t==='qj'?.22:.12});
  c.bindPopup('<b>'+z.n+'</b><br>'+z.info+'<br>半徑 '+z.km+' km · 中心 '+z.lat+', '+z.lng+'<br><a target="_blank" href="https://www.google.com/maps?q='+z.lat+','+z.lng+'">在 Google 地圖開中心點</a>');
  c.addTo(groups[name[z.t]]); L.circleMarker([z.lat,z.lng],{radius:3,color:C[z.t],weight:1,fillOpacity:1}).addTo(groups[name[z.t]]);});
Object.keys(groups).forEach(function(k){groups[k].addTo(map)});
L.control.layers(null,groups,{collapsed:window.innerWidth<600}).addTo(map);
var Q=D.mountain.filter(function(z){return z.t==='qj'})[0];
function km(a,b){var R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x));}
map.on('click',function(e){var p={lat:e.latlng.lat,lng:e.latlng.lng};
  var inside=all.filter(function(z){return km(p,z)<=z.km}).map(function(z){return z.n+'（'+z.info.split('；')[0]+'）'});
  L.popup().setLatLng(e.latlng).setContent('<b>'+p.lat.toFixed(5)+', '+p.lng.toFixed(5)+'</b><br>離清境中心 '+km(p,Q).toFixed(1)+' km（半徑 '+Q.km+' km）<br>'+(inside.length?'在圈內：<br>'+inside.join('<br>'):'不在任何圈內')).openOn(map);});
document.getElementById('qj').onclick=function(){map.setView([Q.lat,Q.lng],12)};
document.getElementById('all').onclick=function(){map.setView([23.7,121.0],8)};
map.setView([Q.lat,Q.lng],12);
</script></body></html>
